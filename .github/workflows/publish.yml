name: Publish

# `bun run release` pushes a vX.Y.Z tag, and this workflow publishes that
# version to npm through trusted publishing (OIDC). No npm token is stored;
# npmjs.com trusts this workflow file by name, and provenance is automatic.
#
# The job deploys to the `npm` environment, which only v* tags and main may
# use, so a workflow changed on any other branch can't publish. To publish an
# existing tag by hand, run this workflow from main with the tag as input.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v1.2.3
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Each run shows under Deployments, linked to the version on npmjs.com.
    environment:
      name: npm
      url: ${{ steps.version.outputs.url }}
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
          # Full history, so the tag can be checked against main.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later. Pinned, because this job
      # holds the token that can publish.
      - name: Update npm
        run: npm install --global npm@11.21.0

      # A release tag must point at a commit on main, so a tag pushed from a
      # side branch can't publish code that was never merged.
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi

      - name: Check the tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "url=https://www.npmjs.com/package/half-fixed/v/$version" >> "$GITHUB_OUTPUT"

      # The release preflight already ran the full checks; this is a smoke test.
      - name: Run both CLIs
        run: |
          node bin/half-fixed.js --version
          node plugins/half-fixed/skills/half-fixed/scripts/half-fixed.js --help > /dev/null

      - name: Install and run the packed tarball
        run: node scripts/smoke-pack.js

      - name: Publish to npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on npm; nothing to publish."
            exit 0
          fi
          npm publish
